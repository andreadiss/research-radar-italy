name: Prepare LinkedIn draft (approval required)

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: linkedin-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare draft from verified recent MUR positions
        run: node scripts/build-linkedin-draft.mjs
      - name: Add draft to job summary
        run: cat artifacts/linkedin/draft.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create one approval issue per week when opportunities are available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if grep -q 'Nessuna bozza pubblicabile' artifacts/linkedin/draft.md; then
            echo "No eligible new positions: skipping issue."
            exit 0
          fi
          WEEK="$(date -u +%G-W%V)"
          TITLE="LinkedIn draft approval — ${WEEK}"
          if gh issue list --state all --limit 200 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Draft issue already exists for $WEEK"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file artifacts/linkedin/draft.md
